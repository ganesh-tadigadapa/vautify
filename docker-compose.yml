# Vault: one API/coordinator + three storage nodes, each node with its own
# named volume. Same binary and architecture as the localhost cluster; only
# the addresses differ (service DNS names instead of 127.0.0.1).
#
# This is a DEMO deployment: chaos endpoints are enabled. A node killed via
# POST /chaos/kill-node exits with status 0 and stays down (restart policy
# on-failure); a real crash (non-zero exit) is restarted. Bring a killed node
# back with: docker compose start vault-node-N
x-node: &node
  build: .
  image: vault:local
  restart: on-failure
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9001/health"]
    interval: 2s
    timeout: 2s
    retries: 15

services:
  vault-node-1:
    <<: *node
    command: ["node", "--id", "node-1", "--listen", "0.0.0.0:9001", "--data", "/data", "--enable-chaos"]
    volumes: ["node-1-data:/data"]

  vault-node-2:
    <<: *node
    command: ["node", "--id", "node-2", "--listen", "0.0.0.0:9001", "--data", "/data", "--enable-chaos"]
    volumes: ["node-2-data:/data"]

  vault-node-3:
    <<: *node
    command: ["node", "--id", "node-3", "--listen", "0.0.0.0:9001", "--data", "/data", "--enable-chaos"]
    volumes: ["node-3-data:/data"]

  vault-api:
    build: .
    image: vault:local
    restart: on-failure
    environment:
      VAULT_REPAIR_WORKERS: "4"
      VAULT_SCRUB_INTERVAL: "30s"
    command:
      - api
      - --listen=0.0.0.0:8080
      - --data=/data
      - --replication-factor=3
      - --enable-chaos
      - --nodes=node-1=http://vault-node-1:9001,node-2=http://vault-node-2:9001,node-3=http://vault-node-3:9001
    ports: ["${VAULT_API_PORT:-8080}:8080"]
    volumes: ["api-data:/data"]
    depends_on:
      vault-node-1: { condition: service_healthy }
      vault-node-2: { condition: service_healthy }
      vault-node-3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  node-1-data:
  node-2-data:
  node-3-data:
  api-data:
